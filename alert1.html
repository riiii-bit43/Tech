<!DOCTYPE html>
<html>
<head>
    <title>Table using For Loop</title>
</head>
<body>

<script>
    let num = 5;
    let result = "";

    for (let i = 1; i <= 10; i++) { //for loop
        let line = num + " x " + i + " = " + (num * i);
        console.log(line);
        result += line + "\n";
    }

    alert("Table of " + num + ":\n\n" + result);
</script>

</body>
</html>
